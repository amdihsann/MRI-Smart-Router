services:
  db:
    image: postgres:15-alpine
    container_name: mri_postgres_db
    environment:
      POSTGRES_USER: mri_admin
      POSTGRES_PASSWORD: mri_password_secure
      POSTGRES_DB: smart_mri_db
    ports:
      - "5432:5432"
    volumes:
      # - ./backend/sql:/docker-entrypoint-initdb.d
      - ./backend/master_hospitals.csv:/tmp/master_hospitals.csv
      # - ./backend/patient_queues.csv:/tmp/patient_queues.csv
      - postgres_data:/var/lib/postgresql/data
